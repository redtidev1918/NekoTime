name: Probe release token
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report token identity and permissions (never fails)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -uo pipefail
          R="$GITHUB_REPOSITORY"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PROBE token=ABSENT_OR_EMPTY"
            exit 0
          fi
          echo "PROBE token=present chars=${#GH_TOKEN}"
          if ! who=$(gh api user --jq '.login + " id=" + (.id|tostring)' 2>&1); then
            echo "PROBE identity=INVALID_TOKEN :: $(printf '%s' "$who" | head -2 | tr '\n' ' ')"
            exit 0
          fi
          echo "PROBE identity=$who"
          echo "PROBE scopes=$(gh api -i user 2>/dev/null | grep -i '^x-oauth-scopes:' | tr -d '\r' || echo none-advertised)"
          sha=$(gh api "repos/$R/commits?per_page=1" --jq '.[0].sha' 2>/dev/null)
          if gh api --method POST "repos/$R/git/refs" -f ref=refs/heads/probe-token-write -f sha="$sha" >/dev/null 2>&1; then
            echo "PROBE contents_write=ok"
            gh api --method DELETE "repos/$R/git/refs/heads/probe-token-write" >/dev/null 2>&1 && echo "PROBE contents_cleanup=ok"
          else
            echo "PROBE contents_write=DENIED"
          fi
          if gh api --method POST "repos/$R/labels" -f name=probe-token-write -f color=ededed >/dev/null 2>&1; then
            echo "PROBE issues_write=ok"
            gh api --method DELETE "repos/$R/labels/probe-token-write" >/dev/null 2>&1 && echo "PROBE issues_cleanup=ok"
          else
            echo "PROBE issues_write=DENIED"
          fi
          echo "PROBE done"
